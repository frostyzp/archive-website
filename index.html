<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What We Tell AI</title>
    <link rel="icon" id="favicon" type="image/png" href="/favicons/favicon_01.png" />
    <style>
      @font-face {
        font-family: 'News Plantin';
        src: url('/NewsPlantin.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Reckless Italic';
        src: url('/recklessItalic.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'OT Brut Mono';
        src: url('/OTBrut-RegularMono.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Faktory';
        src: url('/faktory.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --font-primary: 'Faktory', Georgia, serif;
        --font-display: 'Faktory', Georgia, serif;
        --font-mono: 'Courier New', Courier, monospace;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: var(--font-primary);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }
      ::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Cycle the tab favicon through the five icons, one per second.
      (function () {
        var icons = [
          '/favicons/favicon_01.png',
          '/favicons/favicon_02.png',
          '/favicons/favicon_03.png',
          '/favicons/favicon_04.png',
          '/favicons/favicon_05.png',
        ];
        // Warm the cache so each swap is instant (no first-cycle flicker).
        icons.forEach(function (src) { new Image().src = src; });
        var i = 0;
        setInterval(function () {
          i = (i + 1) % icons.length;
          var link = document.getElementById('favicon');
          if (link) link.href = icons[i];
        }, 1000);
      })();
    </script>
  </body>
</html>
